# Builds the client installers and attaches them to a release in this repo.
# Tag a version (v1.4.0) and this produces:
#   PeepalSetup-1.4.0.exe          Windows
#   Peepal-1.4.0-arm64.pkg         macOS Apple Silicon
#   Peepal-1.4.0-x86_64.pkg        macOS Intel
#   peepal_1.4.0_amd64.deb/.rpm    Linux
name: Release installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to build
        required: true

permissions:
  contents: write

env:
  # Fine-grained PAT with Contents:read on the backend and frontend repos.
  # Baked into the installer so client machines can download private assets.
  PEEPAL_TOKEN: ${{ secrets.PEEPAL_RELEASE_TOKEN }}
  BACKEND_REPO: ${{ vars.PEEPAL_BACKEND_REPO }}
  FRONTEND_REPO: ${{ vars.PEEPAL_FRONTEND_REPO }}

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }
      - name: Set version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Build binaries
        working-directory: installer
        run: TARGETS="linux/amd64 linux/arm64" ./packaging/build.sh
      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
      - name: Package deb and rpm
        working-directory: installer
        run: |
          for ARCH in amd64 arm64; do
            ARCH=$ARCH VERSION=$VERSION envsubst < packaging/linux/nfpm.yaml > /tmp/nfpm-$ARCH.yaml
            nfpm package -f /tmp/nfpm-$ARCH.yaml -p deb -t dist/
            nfpm package -f /tmp/nfpm-$ARCH.yaml -p rpm -t dist/
          done
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: installer/dist/*.{deb,rpm} }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }
      - name: Set version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Build binaries
        shell: bash
        working-directory: installer
        run: TARGETS="windows/amd64" ./packaging/build.sh
      - name: Build Inno Setup installer
        working-directory: installer
        run: |
          choco install innosetup --no-progress -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            /DVersion=$env:VERSION `
            /O"dist" `
            packaging\windows\peepal.iss
      # Signing keeps SmartScreen quiet. Skipped when no certificate is set.
      - name: Sign
        if: ${{ env.WINDOWS_CERT_BASE64 != '' }}
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:WINDOWS_CERT_BASE64))
          & signtool sign /f cert.pfx /p $env:WINDOWS_CERT_PASSWORD /fd SHA256 `
            /tr http://timestamp.digicert.com /td SHA256 installer\dist\*.exe
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: installer/dist/*.exe }

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }
      - name: Set version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Build binaries
        working-directory: installer
        run: TARGETS="darwin/amd64 darwin/arm64" ./packaging/build.sh
      - name: Build packages
        working-directory: installer
        env:
          SIGN_ID: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
          NOTARY_PROFILE: ${{ secrets.MACOS_NOTARY_PROFILE }}
        run: |
          ARCH=arm64 ./packaging/macos/build-pkg.sh
          ARCH=amd64 ./packaging/macos/build-pkg.sh
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: installer/dist/*.pkg }

  publish:
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: Collect and checksum
        run: |
          mkdir -p out && find artifacts -type f -exec mv {} out/ \;
          cd out && sha256sum * > checksums.txt && cat checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
